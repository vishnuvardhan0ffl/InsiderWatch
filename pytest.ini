[pytest]
# Collect only our own tests. Without testpaths, pytest walks the whole tree —
# including any stray clone, vendored copy or virtualenv sitting inside the repo
# — and two files with the same basename under different paths abort collection
# with "import file mismatch".
testpaths = tests

# Belt and braces: never descend into these even if they appear under testpaths.
norecursedirs = .git .venv venv _to_delete *.egg-info data .ipynb_checkpoints

# Puts the repo root on sys.path so `import verify_apis` works from tests/
# without any sys.path juggling in the test files. Requires pytest >= 7.
pythonpath = .

addopts = -q
